name: Build and Push UI Service to ECR

# Joblio is a single Next.js app at the repo root (not a monorepo with a src/<service>/ layout), so paths
# and build/scan targets below point at the repo root instead of a subfolder.
#
# Intentionally stops after push — no Helm/Kubernetes deploy step. That
# lands once the separate DevOps repo/infra exists; `findings` is already
# exposed as a job output for whatever consumes it then.

on:
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "agent/**"
      - "actions/**"
      - "types/**"
      - "public/**"
      - "db/**"
      - "migrations/**"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      #- ".github/workflows/build-push-ui.yaml" # During testing phases only, for prod comment this line
  workflow_dispatch: {}

permissions:
  id-token: write # Needed for OIDC
  contents: read # Only checkout needed — no git push in this workflow

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: joblio/ui
  REPORT_BUCKET: ${{ vars.REPORT_BUCKET }}

jobs:
  # ==============================================================
  # Scan, build and push the image to ECR. Scans never fail this
  # job (continue-on-error) - findings are recorded and surfaced
  # via the `findings` output for a future gate to consume.
  # ==============================================================
  scan-build-push:
    runs-on: ubuntu-latest
    outputs:
      findings: ${{ steps.evaluate.outputs.findings }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ==========================================================
      # Trivy Repository Scan (Secrets + Misconfigurations + Vulnerabilities/SCA)
      # ==========================================================
      - name: Run Trivy Repository Scan
        id: trivy-fs
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: json
          output: trivy-fs.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # ==========================================================
      # Snyk Open Source SCA Scan (npm dependency tree)
      # ==========================================================
      - name: Run Snyk SCA scan
        id: snyk-sca
        continue-on-error: true
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=package.json --severity-threshold=high --json-file-output=snyk-sca.json

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-oidc-role-joblio
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload Trivy repo report to S3
        if: always()
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          aws s3 cp trivy-fs.json \
            s3://${{ env.REPORT_BUCKET }}/trivy-reports/${GITHUB_SHA::7}/trivy-fs-${TIMESTAMP}.json \
            || echo "Trivy report upload skipped"

      - name: Upload Snyk SCA report to S3
        if: always()
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          aws s3 cp snyk-sca.json \
            s3://${{ env.REPORT_BUCKET }}/snyk-reports/${GITHUB_SHA::7}/snyk-sca-${TIMESTAMP}.json \
            || echo "Snyk SCA report upload skipped"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Define image tags
        id: vars
        run: |
          SHA_TAG=sha-${GITHUB_SHA::7}
          IMAGE_BASE="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          echo "SHA_TAG=$SHA_TAG" >> $GITHUB_ENV
          echo "IMAGE_BASE=$IMAGE_BASE" >> $GITHUB_ENV
          echo "TAGS=latest $SHA_TAG" >> $GITHUB_ENV
          echo "Using tags: latest and $SHA_TAG"
          echo "latest = convenience tag for testing"
          echo "$SHA_TAG = immutable tag for future deploy config"

      # NEXT_PUBLIC_* vars are inlined into the client bundle at `next build`
      # time (see Dockerfile's own comment on this) — they must be passed as
      # --build-arg here, not as container-runtime env later. They're read
      # from repo Variables, not Secrets: by definition anything prefixed
      # NEXT_PUBLIC_ ships to the browser, so treating it as a GitHub secret
      # would be misleading, not safer (code-standards.md is explicit about
      # this: "Never add NEXT_PUBLIC_ to secret keys").
      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_APP_URL="${{ vars.NEXT_PUBLIC_APP_URL }}" \
            --build-arg NEXT_PUBLIC_INSFORGE_URL="${{ vars.NEXT_PUBLIC_INSFORGE_URL }}" \
            --build-arg NEXT_PUBLIC_INSFORGE_ANON_KEY="${{ vars.NEXT_PUBLIC_INSFORGE_ANON_KEY }}" \
            --build-arg NEXT_PUBLIC_POSTHOG_KEY="${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}" \
            --build-arg NEXT_PUBLIC_POSTHOG_HOST="${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}" \
            -t $IMAGE_BASE:$SHA_TAG .

      # ==========================================================
      # Trivy Image Scan (OS + app-layer vulnerabilities in the built image)
      # ==========================================================
      - name: Run Trivy Image Scan
        id: trivy-image
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_BASE }}:${{ env.SHA_TAG }}
          scanners: vuln
          format: json
          output: trivy-image.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy image report to S3
        if: always()
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          aws s3 cp trivy-image.json \
            s3://${{ env.REPORT_BUCKET }}/trivy-reports/${GITHUB_SHA::7}/trivy-image-${TIMESTAMP}.json \
            || echo "Trivy image report upload skipped"

      # ==========================================================
      # Snyk Container Scan
      # ==========================================================
      - name: Run Snyk Container scan
        id: snyk-container
        continue-on-error: true
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: "${{ env.IMAGE_BASE }}:${{ env.SHA_TAG }}"
          args: --file=Dockerfile --severity-threshold=high --json-file-output=snyk-container.json

      - name: Upload Snyk report to S3
        if: always()
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          aws s3 cp snyk-container.json \
            s3://${{ env.REPORT_BUCKET }}/snyk-reports/${GITHUB_SHA::7}/snyk-container-${TIMESTAMP}.json \
            || echo "Snyk report upload skipped"

      - name: Evaluate scan findings
        id: evaluate
        if: always()
        run: |
          FOUND=false
          for outcome in "${{ steps.trivy-fs.outcome }}" "${{ steps.snyk-sca.outcome }}" "${{ steps.trivy-image.outcome }}" "${{ steps.snyk-container.outcome }}"; do
            if [ "$outcome" = "failure" ]; then
              FOUND=true
            fi
          done
          echo "findings=$FOUND" >> "$GITHUB_OUTPUT"
          echo "HIGH/CRITICAL findings detected: $FOUND"

      - name: Tag and push Docker images
        run: |
          docker tag $IMAGE_BASE:$SHA_TAG $IMAGE_BASE:latest
          for tag in $TAGS; do
            IMAGE_URI="$IMAGE_BASE:$tag"
            echo "Pushing $IMAGE_URI"
            docker push $IMAGE_URI
          done
